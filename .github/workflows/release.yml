name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          COMMIT="$(git rev-parse --short HEAD)"
          PKG=github.com/mnorrsken/kulprit
          LDFLAGS="-s -w -X $PKG/internal/version.Version=$VERSION -X $PKG/internal/version.Commit=$COMMIT"
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${p%/*}"; arch="${p#*/}"
            out="dist/kubectl-kulprit_${VERSION#v}_${os}_${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/kubectl-kulprit
          done
          cd dist && sha256sum kubectl-kulprit_* > checksums.txt

      - name: Build release notes
        run: |
          set -euo pipefail
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION_NO_V" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## /        { exit }
            found                  { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "No CHANGELOG section for $VERSION_NO_V" >&2
            exit 1
          fi
          cat notes-body.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          With Go:

          \`\`\`sh
          go install github.com/mnorrsken/kulprit/cmd/kubectl-kulprit@v${VERSION_NO_V}
          \`\`\`

          Or take a binary from below, check it and put it on your PATH:

          \`\`\`sh
          sha256sum -c checksums.txt --ignore-missing
          chmod +x kubectl-kulprit_${VERSION_NO_V}_\$(uname -s | tr A-Z a-z)_*
          mv kubectl-kulprit_${VERSION_NO_V}_* ~/.local/bin/kubectl-kulprit
          \`\`\`

          kubectl runs any \`kubectl-*\` binary on PATH as a plugin, so that is all
          \`kubectl kulprit\` needs.

          For shell completion, let the plugin install the helper kubectl needs:

          \`\`\`sh
          kubectl kulprit completion zsh    # or bash, or fish
          \`\`\`
          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes-file notes.md \
            dist/*
